[build-system]
requires = ["setuptools>=69,<82", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "zpe-geo"
version = "0.1.0"
description = "Deterministic geospatial trajectory codec, search surface, and staged proof bundle."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Zer0pa (Pty) Ltd", email = "architects@zer0pa.ai"}]
license = "LicenseRef-Zer0pa-SAL-7.0"
keywords = [
    "geospatial",
    "trajectory-compression",
    "h3-indexing",
    "spatial-search",
    "fleet-telematics",
    "av-telemetry",
    "ais",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Zer0pa/ZPE-Geo"
Documentation = "https://github.com/Zer0pa/ZPE-Geo#readme"
Repository = "https://github.com/Zer0pa/ZPE-Geo"
Issues = "https://github.com/Zer0pa/ZPE-Geo/issues"
Changelog = "https://github.com/Zer0pa/ZPE-Geo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
h3 = ["h3>=4.1"]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
include = ["zpe_geo*"]
