[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zpe-geo"
version = "0.1.0"
description = "Deterministic geospatial trajectory codec, search surface, and staged proof bundle."
requires-python = ">=3.11"
authors = [{name = "Zer0pa"}]
license = "LicenseRef-Zer0pa-SAL-6.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Zer0pa/ZPE-Geo"
Documentation = "https://github.com/Zer0pa/ZPE-Geo/tree/main/docs"
Repository = "https://github.com/Zer0pa/ZPE-Geo"
Changelog = "https://github.com/Zer0pa/ZPE-Geo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "markdown>=3.6", "pytest>=8.0", "pytest-cov>=5.0"]
test = ["build>=1.2", "pytest>=8.0", "pytest-cov>=5.0"]
docs = ["markdown>=3.6"]
h3 = ["h3>=4.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zpe_geo*"]
